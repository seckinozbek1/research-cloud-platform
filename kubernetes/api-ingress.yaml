apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research-cloud-api
spec:
  ingressClassName: cloud-provider-kind
  tls:
    - hosts:
        - research-cloud.local
      secretName: research-cloud-api-tls
  rules:
    - host: research-cloud.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: research-cloud-api
                port:
                  number: 8000
